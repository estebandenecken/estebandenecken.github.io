<style>
:root{--navy:#000116;--cyan:#17B4D8;--gray:#EAEBEC;--card:#0a0d22;--border:#1c2340;--muted:#8b93ad;--hover:#0d1230}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--navy);color:var(--gray);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:48px 20px;text-align:center;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--cyan) 13%, transparent), transparent 70%);
}
.wrap{max-width:420px}
.code{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-weight:700}
h1{font-size:26px;letter-spacing:-.4px;margin:10px 0 8px}
p{color:var(--muted);font-size:14.5px;margin-bottom:26px}
a{
  display:block;text-decoration:none;color:var(--gray);font-weight:600;font-size:15px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;
  transition:border-color .15s ease,transform .15s ease,background .15s ease;
}
a + a{margin-top:10px}
a:hover{border-color:var(--cyan);transform:translateY(-2px);background:var(--hover)}
</style>
</head>
